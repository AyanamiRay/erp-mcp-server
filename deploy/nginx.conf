user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ============================================================
    # MCP Server 集群上游配置
    # ============================================================
    upstream mcp_cluster {
        # 极其重要：基于请求 URL 中的 sessionId 参数做一致性哈希，
        # 确保同一个 SSE 会话发起的后续 POST /messages 精准路由到同一 Pod/容器
        hash $arg_sessionId consistent;

        server mcp-node-1:3000 max_fails=3 fail_timeout=10s;
        server mcp-node-2:3000 max_fails=3 fail_timeout=10s;

        # 保持连接池，减少 TCP 握手开销
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # 允许最大请求体（上传或批量注册工具元数据）
        client_max_body_size 20M;

        # 1. 探活端点（无需粘性哈希，直接轮询检查）
        location /healthz {
            proxy_pass http://mcp_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # 2. SSE 长连接与消息通信端点（核心高可用配置）
        location / {
            proxy_pass http://mcp_cluster;
            proxy_http_version 1.1;

            # 核心必须项：关闭代理缓冲，使 SSE 事件流可以即时流式推送至客户端
            proxy_buffering off;
            proxy_cache off;

            # 超时时间延长至 1 小时，防止 Nginx 默认 60s 超时断开长连接
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 清空 Connection 头，以配合 HTTP/1.1 keepalive
            proxy_set_header Connection '';

            # 透传客户端真实 IP 和 Host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
